services:
  cableworld-epg:
    build: .
    container_name: cableworld-epg
    restart: unless-stopped
    environment:
      CHANNEL_ID: "Telecrevillent"   # = tvg-id del canal en el m3u
      CHANNEL_NAME: "Telecrevillent"
      INTERVAL_HOURS: "6"
    ports:
      - "8080:8080"
    volumes:
      - epg-data:/data
volumes:
  epg-data:
