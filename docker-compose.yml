services:
  cableworld-epg:
    build: .
    container_name: cableworld-epg
    restart: unless-stopped
    environment:
      CHANNEL_ID: "Telecrevillent"   # = tvg-id del canal en el m3u
      CHANNEL_NAME: "Telecrevillent"
      CHANNEL_LOGO: "https://hlsnov.cableworld.es/logo.png"
      INTERVAL_HOURS: "24"
    ports:
      - "${EPG_PORT:-8099}:8080"
    volumes:
      - epg-data:/data
volumes:
  epg-data:
